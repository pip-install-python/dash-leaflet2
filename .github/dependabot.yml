# Copied from dash-documentation-boilerplate — with ONE deliberate addition,
# the npm ecosystem below (DIVERGENCES.md §3). That addition is why this path
# is listed in DIVERGENCES.md's `byte-owned` fence: the F3b fan-out skips it,
# so template changes to this file land HERE BY HAND, as this one did.
#
# Version updates for pip are OFF BY DESIGN (template 1.6.24, applied by hand
# 2026-08-26). On range requirements dependabot can only propose FLOOR
# RAISES, so the old `dash-network` allow-list group structurally produced
# the exact PR class the allow-list existed to suppress — 18 of the fleet's
# 38 open dependabot PRs were pip floor-raises. Floors encode
# minimum-compatibility knowledge (a gunicorn floor IS the CVE fact; this
# repo's dash-improve-my-llms floor is the Docker cache-bust mechanism), the
# resolver already installs latest under them, and a raise erases the floor's
# meaning while adding none. Floors move deliberately, through sync specs,
# every encoding at once; drift detection — the group's stated purpose — is
# already answered on the wire by the contract battery (healthz
# `dash_version` against the floor).
#
# SECURITY updates are unaffected. They ride GitHub's security-update
# channel — dependency graph + Dependabot alerts, enabled per repo in
# Settings → Advanced Security — which needs no entry in this file:
# "There is no interaction between the settings specified in the
# dependabot.yml file and Dependabot security alerts" (GitHub docs,
# code-security/concepts/supply-chain-security/dependabot-security-updates).
version: 2
updates:
  # DIVERGENCE 3 — not in the template. This repo also builds the
  # dash-leaflet2 component bundle from src/ts, so it carries a lockfile the
  # template has no equivalent of. npm version updates are NOT the pip case:
  # devDependencies are pinned, not floored, so a bump here is a real
  # upgrade with a real diff, CI-gated like any other.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns:
          - "*"

  # Runner/action bumps are mechanical and CI-gated; a human merges the
  # group's PR when its CI is green — never a bot actor on main. (The
  # 1.6.24 auto-merge workflow was retired in 1.6.25: a GITHUB_TOKEN merge
  # gets zero workflow runs on the merge sha, so its deploy is never
  # certified by CD.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Docker base-image bumps stay manual: a Python major is a merits
  # decision, never an auto-merge.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
