<!DOCTYPE html>

<head>
    <!-- ========================================================================
         dash-leaflet2 documentation — https://leaflet.2plot.dev
         ========================================================================
         This file was inherited from the Dash Documentation Boilerplate and had
         never been customised. Everything below is now specific to this project.
         Two rules if you edit it:

           1. Do NOT add a static description meta tag. Dash emits one per page
              from the frontmatter, via the metas placeholder below. A static
              one here produced TWO description tags on every page, the first
              of them describing a different product entirely.
           2. The canonical URL is set by script, not statically — see below.
         ======================================================================== -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Fallback title. Dash overrides this per page from register_page(title=). -->
    <title>dash-leaflet2 — Leaflet 2 mapping components for Dash 4</title>
    <meta name="title" content="dash-leaflet2 — Leaflet 2 mapping components for Dash 4">

    <meta name="keywords" content="dash-leaflet2, dash leaflet, leaflet 2, leaflet2, plotly dash maps, dash mapping components, python gis, interactive maps python, geojson dash, tile layer, pointer events, map rotation, react-leaflet alternative">
    <meta name="author" content="Pip Install Python LLC">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <!-- ========================================================================
         OPEN GRAPH / TWITTER
         ========================================================================
         Only the two tags Dash does NOT emit itself.

         dash.register_page() makes Dash generate per-page og:title, og:type,
         og:description, og:image and the full twitter:* set on every request
         (see _page_meta_tags in dash/_pages.py). Declaring those here as well
         produced two of each, with the static copy describing the site instead
         of the page — strictly worse than Dash's version, which is per-page and
         accurate. They have been removed.

         og:site_name and og:url are genuinely missing from Dash's set, so they
         belong here. og:url is kept current by the canonical script below.

         No og:image is declared: shipping a URL that 404s is worse than having
         none, and no brand image exists yet. Dash emits an EMPTY og:image and
         twitter:image for the same reason — to fix those properly, add
         assets/og-image.png (1200x630) and pass image_url= to register_page in
         pages/markdown.py.
         ======================================================================== -->

    <meta property="og:site_name" content="dash-leaflet2">
    <meta property="og:url" content="https://leaflet.2plot.dev/">

    <!-- Mantine green, matching the brand. -->
    <meta name="theme-color" content="#2f9e44">

    <!-- ========================================================================
         CANONICAL URL
         ========================================================================
         Set by script, deliberately.

         This is a single-page app: one HTML document serves every route, so a
         STATIC canonical necessarily lies about all but one page. The inherited
         value still pointed at the upstream boilerplate's own deployment — a
         different site entirely — which told search engines every page here
         was a duplicate of somewhere else.

         The origin is hard-coded rather than read from location.origin so that
         hits on the Render URL (dash-leaflet2.onrender.com) consolidate onto the
         custom domain instead of competing with it.
         ======================================================================== -->
    <link rel="canonical" href="https://leaflet.2plot.dev/">
    <script>
        (function () {
            var ORIGIN = 'https://leaflet.2plot.dev';
            function sync() {
                var path = location.pathname.replace(/\/+$/, '') || '/';
                var href = ORIGIN + (path === '/' ? '/' : path);

                var canonical = document.querySelector('link[rel="canonical"]');
                if (canonical) canonical.href = href;

                // querySelectorAll, not querySelector: Dash emits its own
                // twitter:url from request.url. That is correct on the entry
                // page, but it is baked in server-side and goes STALE the
                // moment Dash routes client-side — every later page would
                // still advertise the URL the visitor first landed on. Both
                // copies get corrected on every route change.
                document.querySelectorAll(
                    'meta[property="og:url"], meta[property="twitter:url"]'
                ).forEach(function (m) { m.setAttribute('content', href); });
            }

            sync();

            // Dash routes client-side through history.pushState, which fires no
            // event — patch both history methods so the canonical follows SPA
            // navigation rather than freezing on the entry page.
            ['pushState', 'replaceState'].forEach(function (method) {
                var original = history[method];
                history[method] = function () {
                    var result = original.apply(this, arguments);
                    sync();
                    return result;
                };
            });
            window.addEventListener('popstate', sync);
        })();
    </script>

    <!-- LLM-friendly rendering of the current page, for anything that prefers
         markdown to a JS-rendered SPA. Served by dash-improve-my-llms. -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="LLM-friendly documentation">

    <noscript>
        <div style="padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 820px; margin: 0 auto; line-height: 1.6;">
            <h1>dash-leaflet2</h1>
            <p><strong>Leaflet 2-native mapping components for Plotly Dash 4.</strong></p>
            <p>
                <code>dash-leaflet</code> is frozen on react-leaflet and Leaflet 1.9.
                This library wraps Leaflet 2 core directly, which unlocks unified
                Pointer Events, <code>BlanketOverlay</code> canvas/WebGL layers,
                ES6-class subclassing, <code>ResizeObserver</code> sizing and map
                rotation — all driven from Python.
            </p>

            <p><strong>The interactive documentation requires JavaScript.</strong>
               These formats do not:</p>

            <ul style="margin: 20px 0;">
                <li><a href="/llms.txt" style="color: #2f9e44;"><strong>llms.txt</strong></a> — the whole site as LLM-friendly markdown</li>
                <li><a href="/sitemap.xml" style="color: #2f9e44;"><strong>sitemap.xml</strong></a> — every documentation page</li>
                <li><a href="/robots.txt" style="color: #2f9e44;"><strong>robots.txt</strong></a> — crawler instructions</li>
            </ul>

            <p>Every page also serves its own <code>/&lt;page&gt;/llms.txt</code>
               containing the prose plus the complete, runnable example source.</p>

            <h2>Install</h2>
            <pre style="background:#f5f5f5;padding:12px;border-radius:6px;overflow-x:auto;"><code>pip install dash-leaflet2</code></pre>
            <p>Requires Python 3.9+ and Dash 4.1+. The compiled JavaScript bundle
               ships inside the package — no Node, no build step, no
               <code>external_scripts</code>.</p>

            <h2>Components</h2>
            <p>26 in total: <code>Map</code>, <code>TileLayer</code>,
               <code>Marker</code>, <code>Popup</code>, <code>Tooltip</code>,
               <code>GeoJSON</code> (with clustering), <code>LayerGroup</code>,
               <code>FeatureGroup</code>, <code>ImageOverlay</code>,
               <code>Circle</code>, <code>CircleMarker</code>,
               <code>Polyline</code>, <code>Polygon</code>,
               <code>Rectangle</code>, <code>LayersControl</code>,
               <code>EditControl</code>, <code>AttributionControl</code>,
               <code>ScaleControl</code>, <code>FullScreenControl</code>,
               <code>MiniMap</code>, <code>EasyButton</code>,
               <code>KeyboardControl</code>, <code>TileSelector</code>,
               <code>TextMarker</code>, and the <code>BaseLayer</code> /
               <code>Overlay</code> pair.</p>
